<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Padaria Pão Brioche</title>
    <!-- AQUI ESTÁ O LINK QUE PUXA O CSS! -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Um pouquinho de CSS extra só para deixar os botões do menu inicial bem bonitos -->
    <style>
        .menu-inicial {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: nowrap; /* Garante que fique tudo na mesma linha */
            max-width: 1200px; /* Aumentei para caber os 5 itens lado a lado */
            margin-left: auto;
            margin-right: auto;
            overflow-x: auto; /* Se abrir no celular, permite rolar para o lado sem quebrar */
            padding-bottom: 10px;
        }
        .cartao-modulo {
            background: white;
            padding: 30px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            text-decoration: none;
            color: #333;
            width: 200px; /* Diminuí um pouco a largura para caberem melhor */
            flex: 0 0 auto; /* Mantém o tamanho fixo de cada quadrado */
            transition: transform 0.2s, border-color 0.2s;
            border: 2px solid transparent;
        }
        .cartao-modulo:hover {
            transform: translateY(-5px);
            border-color: #3498db;
        }
        .cartao-modulo h2 {
            margin: 15px 0 0 0; /* Removida a margem inferior já que não tem mais subtítulo */
            color: #2c3e50;
            font-size: 1.5rem;
        }
        .icone-grande {
            font-size: 3.5rem;
        }
    </style>
</head>
<body>
    <div class="container-pagina" style="text-align: center; margin-top: 50px;">
        <h1 style="font-size: 2.5rem; color: #2c3e50;">🥖 Sistema Padaria Pão Brioche 🥖</h1>
        <p style="font-size: 1.2rem; color: #555; margin-top: 10px;">Selecione o módulo que deseja acessar:</p>

        <div class="menu-inicial">
            <!-- Link para o Caixa -->
            <a href="caixa.html" class="cartao-modulo">
                <div class="icone-grande">🛒</div>
                <h2>Caixa</h2>
            </a>

            <!-- Link para a Cozinha -->
            <a href="cozinha.html" class="cartao-modulo">
                <div class="icone-grande">👨‍🍳</div>
                <h2>Cozinha</h2>
            </a>

            <!-- Link para o Gerente -->
            <a href="gerente.html" class="cartao-modulo">
                <div class="icone-grande">📊</div>
                <h2>Gerente</h2>
            </a>

            <!-- Link para Pedidos -->
            <a href="pedidos.html" class="cartao-modulo">
                <div class="icone-grande">📋</div>
                <h2>Pedidos</h2>
            </a>

            <!-- Link para Repositor -->
            <a href="repositor.html" class="cartao-modulo">
                <div class="icone-grande">🏬</div>
                <h2>Repositor</h2>
            </a>
        </div>
    </div>
</body>
</html>
